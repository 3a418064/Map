<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊管理 App</title>
    <style>
        /* 保持你原本的基礎樣式 */
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .container { max-width: 500px; margin: auto; }
        
        /* 分頁按鈕樣式 */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tabs button { flex: 1; padding: 10px; cursor: pointer; border: none; background: #ddd; border-radius: 5px; }
        .tabs button.active { background: #007bff; color: white; }

        .page { display: none; }
        .page.active { display: block; }

        /* 卡片樣式 */
        .item-card { 
            background: white; border-radius: 10px; padding: 15px; 
            margin-bottom: 10px; shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        
        /* 第三頁專用的點選樣式 */
        .selector-group { margin: 10px 0; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .btn-group button { 
            padding: 4px 10px; border: 1px solid #ccc; background: #fff; 
            border-radius: 15px; cursor: pointer; margin-right: 5px;
        }
        .btn-group button.active { background: #007bff; color: white; border-color: #007bff; }
        
        .stars { color: #ccc; cursor: pointer; font-size: 20px; }
        .stars .filled { color: #ffc107; }

        /* 🚩 旗子標記：照你要求的，不畫線、不變色，只標旗子 */
        .flag { margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <nav class="tabs">
        <button onclick="showPage(1)" id="t1" class="active">編輯</button>
        <button onclick="showPage(2)" id="t2">清單</button>
        <button onclick="showPage(3)" id="t3">未造訪名單</button>
    </nav>

    <div id="page1" class="page active">
        <input type="text" id="inputName" placeholder="新增地點...">
        <button onclick="addItem()">新增</button>
        <div id="list1"></div>
    </div>

    <div id="page2" class="page">
        <div id="list2"></div>
    </div>

    <div id="page3" class="page">
        <div id="unvisitedList"></div>
    </div>
</div>

<script>
    // 資料結構
    let items = JSON.parse(localStorage.getItem('travel_data')) || [];
    const categories = ["美食", "景點", "住宿"];

    function showPage(p) {
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
        document.getElementById('page' + p).classList.add('active');
        document.getElementById('t' + p).classList.add('active');
        render();
    }

    function addItem() {
        const val = document.getElementById('inputName').value;
        if(!val) return;
        items.push({
            id: Date.now(),
            name: val,
            visited: false,
            rating: 0,
            category: "景點"
        });
        document.getElementById('inputName').value = '';
        save();
    }

    function toggleVisited(id) {
        const item = items.find(i => i.id === id);
        if(item) {
            item.visited = !item.visited;
            save();
        }
    }

    function updateRate(id, r) {
        items.find(i => i.id === id).rating = r;
        save();
    }

    function updateCat(id, c) {
        items.find(i => i.id === id).category = c;
        save();
    }

    function save() {
        localStorage.setItem('travel_data', JSON.stringify(items));
        render();
    }

    function render() {
        const l1 = document.getElementById('list1');
        const l2 = document.getElementById('list2');
        const l3 = document.getElementById('unvisitedList');

        // 第一頁與第二頁渲染 (維持你原本的邏輯，僅補上旗子判斷)
        const commonHtml = items.map(i => `
            <div class="item-card">
                ${i.visited ? '<span class="flag">🚩</span>' : ''} ${i.name}
                <button onclick="toggleVisited(${i.id})">${i.visited ? '設為未去' : '標記去過'}</button>
            </div>
        `).join('');
        l1.innerHTML = commonHtml;
        l2.innerHTML = commonHtml;

        // 第三頁渲染 (只顯示未造訪 + 點選式介面)
        l3.innerHTML = items.filter(i => !i.visited).map(i => `
            <div class="item-card">
                <strong>${i.name}</strong>
                
                <div class="selector-group">
                    類別：
                    <div class="btn-group">
                        ${categories.map(c => `
                            <button class="${i.category === c ? 'active' : ''}" onclick="updateCat(${i.id}, '${c}')">${c}</button>
                        `).join('')}
                    </div>
                </div>

                <div class="selector-group">
                    評級：
                    <div class="stars">
                        ${[1,2,3,4,5].map(num => `
                            <span class="${i.rating >= num ? 'filled' : ''}" onclick="updateRate(${i.id}, ${num})">★</span>
                        `).join('')}
                    </div>
                </div>

                <button onclick="toggleVisited(${i.id})">點選已去</button>
            </div>
        `).join('') || '<p>目前沒有未造訪的地點</p>';
    }

    render();
</script>

</body>
</html>
