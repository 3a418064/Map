<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雙人班表系統 (完美視覺優化版)</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 html2canvas 截圖套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    @font-face {
      font-family: 'Miao';
      src: url('./Miao.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    
    body {
      font-family: 'Miao', sans-serif !important;
    }

    /* 重新設計：最現代且穩定的 Flexbox 居中與視覺留白優化 */
    .shift-block {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: 44px;         /* 稍微加高，給予字體伸展空間 */
      border-radius: 8px;       /* 柔和的圓角 */
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04); /* 微立體感陰影 */
      padding: 6px 4px;         /* 關鍵防壓扁安全邊距 */
      transition: all 0.2s ease;
    }
    
    .shift-text {
      font-weight: bold;
      color: #1e293b;           /* 沉穩的深色代替純黑，看起來更高級 */
      line-height: 1.1;         /* 修正字型無視覺重心的問題 */
      text-align: center;
      white-space: nowrap;      /* 防止字體過大時，單個字被強行斷行 */
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-black min-h-screen p-2 md:p-6">

  <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- 頂部區塊 -->
    <div class="p-4 md:p-6 border-b border-slate-200 bg-slate-100">
      <div class="flex flex-col gap-4">
        <!-- 說明 -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-sm text-slate-600 mb-2 bg-blue-50 p-3 rounded-lg">
          <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500 shrink-0"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            <p>先選班別再點格子。快捷鍵 <kbd class="bg-white border px-1.5 py-0.5 rounded shadow-sm font-mono font-bold text-slate-800">Ctrl + S</kbd> 可快速儲存班表照片！</p>
          </div>
          <div class="flex gap-2 w-full sm:w-auto">
            <button onclick="exportToImage()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-bold text-sm transition-all shadow-sm flex items-center gap-1 shrink-0">
              📸 匯出班表照片
            </button>
            <button onclick="toggleManager()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-bold text-sm transition-all shadow-sm shrink-0">
              ⚙️ 自訂班別
            </button>
          </div>
        </div>

        <!-- 軒 班別 -->
        <div>
          <h3 class="font-bold text-lg mb-2 flex items-center gap-2">
            <span class="bg-slate-700 text-white px-3 py-1 rounded-full text-sm">軒</span> 班別選擇
          </h3>
          <div id="xuan-buttons" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="h-px bg-slate-300 w-full my-1"></div>

        <!-- 恩 班別 -->
        <div>
          <h3 class="font-bold text-lg mb-2 flex items-center gap-2">
            <span class="bg-slate-700 text-white px-3 py-1 rounded-full text-sm">恩</span> 班別選擇
          </h3>
          <div id="en-buttons" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="h-px bg-slate-300 w-full my-1"></div>
        
        <!-- 字體大小調整 -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center gap-4">
            <div class="flex items-center gap-2 font-bold text-slate-700">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="m5 10 7-7 7 7"/><path d="m5 14 7 7 7-7"/></svg>
                表格班別字體大小: 
            </div>
            <input type="range" id="font-size-slider" min="12" max="32" value="18" class="w-full max-w-xs accent-indigo-600" oninput="updateFontSize(this.value)">
            <span id="font-size-display" class="font-mono bg-slate-100 px-2 py-1 rounded text-sm text-slate-600 w-12 text-center">18px</span>
        </div>
      </div>
    </div>

    <!-- === 班別自訂管理彈窗面板 === -->
    <div id="manager-panel" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[85vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h2 class="text-xl font-bold flex items-center gap-2">⚙️ 班別管理中心</h2>
          <button onclick="toggleManager()" class="text-gray-500 hover:text-black font-bold text-xl">&times;</button>
        </div>
        
        <!-- 新增班別表單 -->
        <div class="bg-slate-50 p-4 rounded-xl mb-6 border border-slate-200">
          <h3 class="font-bold mb-2 text-indigo-800">✨ 新增自訂班別</h3>
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">隸屬人員</label>
              <select id="new-shift-person" class="w-full p-2 border rounded-lg bg-white font-bold">
                <option value="xuan">軒 (Xuan)</option>
                <option value="en">恩 (En)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">班別名稱</label>
              <input type="text" id="new-shift-name" placeholder="例如: 假日班" class="w-full p-2 border rounded-lg bg-white font-bold">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">班別顏色</label>
              <input type="color" id="new-shift-color" value="#fed7aa" class="w-full h-10 p-1 border rounded-lg bg-white cursor-pointer">
            </div>
            <button onclick="addNewShift()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-2 rounded-lg transition-all">
              確認新增
            </button>
          </div>
        </div>

        <!-- 現有班別列表編輯 -->
        <div>
          <h3 class="font-bold mb-3 text-slate-700">✏️ 現有班別編輯與刪除 (點擊顏色可更換)</h3>
          <div class="space-y-4">
            <div>
              <h4 class="font-bold text-sm bg-slate-200 px-2 py-1 rounded inline-block mb-2">軒 的班別</h4>
              <div id="manager-xuan-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
            </div>
            <div class="h-px bg-slate-200 my-2"></div>
            <div>
              <h4 class="font-bold text-sm bg-slate-200 px-2 py-1 rounded inline-block mb-2">恩 的班別</h4>
              <div id="manager-en-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
            </div>
          </div>
        </div>
        
        <div class="mt-6 pt-4 border-t flex justify-end">
          <button onclick="toggleManager()" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-6 py-2 rounded-lg">完成關閉</button>
        </div>
      </div>
    </div>

    <!-- === 日曆區塊 (完美優化觀賞角度) === -->
    <div id="calendar-capture-area" class="bg-white p-4 md:p-6">
      
      <!-- 月份與切換 -->
      <div class="flex justify-center items-center p-4 mb-4 border-b border-slate-100 gap-4 bg-white">
        <div class="flex items-center gap-6">
          <button data-html2canvas-ignore="true" onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-400 hover:text-slate-800">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          
          <!-- 標題 -->
          <h2 id="month-title" class="text-2xl md:text-3.5xl font-bold tracking-widest pt-2 text-slate-800 text-center"></h2>
          
          <button data-html2canvas-ignore="true" onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-400 hover:text-slate-800">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>

      <!-- 日曆表格 -->
      <div class="bg-white">
        <!-- 星期欄位優化：更沉穩現代的背景與間距 -->
        <div class="grid grid-cols-7 gap-2 mb-3">
          <div class="bg-slate-50 border border-slate-100 rounded-xl text-slate-500 font-bold text-center py-2.5 text-base md:text-lg pt-3.5">一</div>
          <div class="bg-slate-50 border border-slate-100 rounded-xl text-slate-500 font-bold text-center py-2.5 text-base md:text-lg pt-3.5">二</div>
          <div class="bg-slate-50 border border-slate-100 rounded-xl text-slate-500 font-bold text-center py-2.5 text-base md:text-lg pt-3.5">三</div>
          <div class="bg-slate-50 border border-slate-100 rounded-xl text-slate-500 font-bold text-center py-2.5 text-base md:text-lg pt-3.5">四</div>
          <div class="bg-slate-50 border border-slate-100 rounded-xl text-slate-500 font-bold text-center py-2.5 text-base md:text-lg pt-3.5">五</div>
          <div class="text-orange-500 bg-orange-50/50 border border-orange-100 rounded-xl font-bold text-center py-2.5 text-base md:text-lg pt-3.5">六</div>
          <div class="text-red-500 bg-red-50/50 border border-red-100 rounded-xl font-bold text-center py-2.5 text-base md:text-lg pt-3.5">日</div>
        </div>
        
        <!-- 格子區 -->
        <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
      </div>
    </div>
    <!-- === 日曆區塊結束 === -->

  </div>

  <script>
    // 預設班別色票庫
    const DEFAULT_COLORS = {
      '早班': '#fef08a', '白班': '#fef08a',
      '長早': '#fed7aa', '放假': '#bbf7d0',
      '中班': '#fecaca', '值班': '#fecaca',
      '大夜': '#e9d5ff', '小夜': '#bfdbfe',
      '清除': '#f3f4f6'
    };
    
    const DEFAULT_XUAN_SHIFTS = ['早班', '長早', '中班', '放假', '大夜', '小夜', '清除'];
    const DEFAULT_EN_SHIFTS = ['白班', '放假', '值班', '清除'];

    let shiftColors = JSON.parse(localStorage.getItem('shiftColorsApp')) || DEFAULT_COLORS;
    let xuanShifts = JSON.parse(localStorage.getItem('xuanShiftsApp')) || DEFAULT_XUAN_SHIFTS;
    let enShifts = JSON.parse(localStorage.getItem('enShiftsApp')) || DEFAULT_EN_SHIFTS;

    let currentDate = new Date();
    let schedule = JSON.parse(localStorage.getItem('monthlyScheduleApp')) || {};
    let activeTool = null;
    let currentFontSize = localStorage.getItem('shiftFontSize') || '18'; // 預設最佳舒適字體 18px

    function renderButtons() {
      const createBtnHTML = (person, shift) => {
        const isActive = activeTool?.person === person && activeTool?.shift === shift;
        const activeClass = isActive ? 'border-slate-800 shadow-md scale-105 ring-2 ring-slate-800' : 'border-transparent hover:opacity-80 hover:scale-105';
        const isClear = shift === '清除';
        const clearClass = isClear ? 'border-dashed border-gray-400' : '';
        const bgHex = shiftColors[shift] || '#e2e8f0';
        
        return `
          <button onclick="setActiveTool('${person}', '${shift}')" 
                  class="px-4 py-1.5 rounded-lg font-medium transition-all duration-200 border-2 text-black pt-2.5 ${activeClass} ${clearClass}" 
                  style="background-color: ${bgHex};">
            ${isClear ? '🧹 ' : ''}${shift}
          </button>
        `;
      };
      document.getElementById('xuan-buttons').innerHTML = xuanShifts.map(s => createBtnHTML('xuan', s)).join('');
      document.getElementById('en-buttons').innerHTML = enShifts.map(s => createBtnHTML('en', s)).join('');
    }

    function renderManagerLists() {
      const createManagerItemHTML = (person, shift) => {
        if (shift === '清除') return ''; 
        const currentHex = shiftColors[shift] || '#e2e8f0';
        return `
          <div class="flex items-center justify-between bg-white p-2 border rounded-lg shadow-sm">
            <div class="flex items-center gap-2 flex-1">
              <input type="color" value="${currentHex}" 
                     onchange="updateShiftColor('${shift}', this.value)" 
                     class="w-8 h-8 rounded border cursor-pointer shrink-0">
              <input type="text" value="${shift}" 
                     onchange="renameShift('${person}', '${shift}', this.value)" 
                     class="font-bold border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:bg-slate-50 px-1 py-0.5 w-24 text-sm rounded">
            </div>
            <button onclick="deleteShift('${person}', '${shift}')" class="text-red-500 hover:text-red-700 text-sm font-bold px-2 py-1 rounded hover:bg-red-50">
              ❌ 刪除
            </button>
          </div>
        `;
      };
      document.getElementById('manager-xuan-list').innerHTML = xuanShifts.map(s => createManagerItemHTML('xuan', s)).join('') || '<p class="text-xs text-gray-400">暫無自訂班別</p>';
      document.getElementById('manager-en-list').innerHTML = enShifts.map(s => createManagerItemHTML('en', s)).join('') || '<p class="text-xs text-gray-400">暫無自訂班別</p>';
    }

    window.toggleManager = function() {
      const panel = document.getElementById('manager-panel');
      panel.classList.toggle('hidden');
      if (!panel.classList.contains('hidden')) { renderManagerLists(); }
    };

    window.addNewShift = function() {
      const person = document.getElementById('new-shift-person').value;
      const name = document.getElementById('new-shift-name').value.trim();
      const color = document.getElementById('new-shift-color').value;

      if (!name) { alert('請輸入班別名稱！'); return; }
      if (name === '清除') { alert('不能使用「清除」作名稱！'); return; }

      const targetList = person === 'xuan' ? xuanShifts : enShifts;
      if (targetList.includes(name)) { alert('該人員已有相同名稱的班別！'); return; }

      shiftColors[name] = color;
      targetList.splice(targetList.length - 1, 0, name);

      saveAllShiftSettings();
      renderButtons();
      renderManagerLists();
      renderCalendar();
      document.getElementById('new-shift-name').value = '';
    };

    window.deleteShift = function(person, shift) {
      if (!confirm(`確定要刪除「${shift}」班別嗎？`)) return;
      if (person === 'xuan') { xuanShifts = xuanShifts.filter(s => s !== shift); } 
      else { enShifts = enShifts.filter(s => s !== shift); }
      if (activeTool && activeTool.shift === shift && activeTool.person === person) { activeTool = null; }
      saveAllShiftSettings();
      renderButtons();
      renderManagerLists();
      renderCalendar();
    };

    window.updateShiftColor = function(shift, newHex) {
      shiftColors[shift] = newHex;
      saveAllShiftSettings();
      renderButtons();
      renderCalendar();
    };

    window.renameShift = function(person, oldName, newName) {
      newName = newName.trim();
      if (!newName || oldName === newName) return;
      if (newName === '清除') { alert('名稱不可為清除'); return; }

      const targetList = person === 'xuan' ? xuanShifts : enShifts;
      if (targetList.includes(newName)) { alert('名稱重複了！'); renderManagerLists(); return; }

      const idx = targetList.indexOf(oldName);
      if (idx !== -1) targetList[idx] = newName;
      shiftColors[newName] = shiftColors[oldName];
      
      Object.keys(schedule).forEach(dateStr => {
        if (schedule[dateStr][person] === oldName) { schedule[dateStr][person] = newName; }
      });
      localStorage.setItem('monthlyScheduleApp', JSON.stringify(schedule));

      if (activeTool && activeTool.shift === oldName && activeTool.person === person) { activeTool.shift = newName; }
      saveAllShiftSettings();
      renderButtons();
      renderManagerLists();
      renderCalendar();
    };

    function saveAllShiftSettings() {
      localStorage.setItem('shiftColorsApp', JSON.stringify(shiftColors));
      localStorage.setItem('xuanShiftsApp', JSON.stringify(xuanShifts));
      localStorage.setItem('enShiftsApp', JSON.stringify(enShifts));
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('month-title').innerText = `${year} 年 ${month + 1} 月 班表`;

      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);
      const firstDayOfWeek = firstDayOfMonth.getDay();
      const offset = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;

      let html = '';
      for (let i = 0; i < offset; i++) {
        html += `<div class="bg-transparent rounded-xl min-h-[140px] md:min-h-[160px]"></div>`;
      }

      const todayStr = new Date().toLocaleDateString('en-CA');
      
      const createShiftBlock = (name, shiftName) => {
        if (!shiftName) return '';
        const bgHex = shiftColors[shiftName] || '#e2e8f0';
        return `
          <div class="w-full px-0.5 my-0.5">
            <div class="shift-block" style="background-color: ${bgHex};">
              <span class="shift-text" style="font-size: ${currentFontSize}px;">
                ${name}${shiftName}
              </span>
            </div>
          </div>
        `;
      };

      for (let d = 1; d <= lastDayOfMonth.getDate(); d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isToday = todayStr === dateStr;
        const dayData = schedule[dateStr] || {};

        // 日曆格子外觀升級：改用更優雅的 rounded-xl 與微淡灰色邊框
        let cellClasses = `min-h-[140px] md:min-h-[160px] p-1.5 border rounded-xl flex flex-col cursor-pointer transition-all bg-white hover:ring-2 hover:ring-blue-400 `;
        cellClasses += isToday ? 'border-blue-400 bg-blue-50/20 ring-1 ring-blue-400 shadow-sm' : 'border-slate-200 shadow-sm';

        let shiftsHtml = '';
        if (dayData.xuan) shiftsHtml += createShiftBlock('軒', dayData.xuan);
        if (dayData.en) shiftsHtml += createShiftBlock('恩', dayData.en);

        // 日期數字視覺微調：降低色彩侵略度，挪到右上方
        html += `
          <div class="${cellClasses}" onclick="handleDayClick('${dateStr}')">
            <div class="text-right text-xs md:text-sm font-bold mb-1.5 px-1 ${isToday ? 'text-blue-600' : 'text-slate-400'}">${d}</div>
            <div class="flex flex-col flex-1 justify-start items-center gap-0.5 w-full min-h-0">${shiftsHtml}</div>
          </div>
        `;
      }
      document.getElementById('calendar-grid').innerHTML = html;
    }

    // 📸 照片匯出主程式（優化白邊與清晰度）
    window.exportToImage = function() {
      const element = document.getElementById('calendar-capture-area');
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      
      setTimeout(() => {
        html2canvas(element, {
          scale: 3,                 // 提高到 3 倍高解析度，文字更銳利不模糊
          useCORS: true,
          backgroundColor: '#ffffff'
        }).then(canvas => {
          const image = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = `${year}年${month}月_雙人班表.png`;
          link.href = image;
          link.click();
        });
      }, 200);
    };

    // ⌨️ 快捷鍵
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        exportToImage();
      }
    });

    window.setActiveTool = function(person, shift) { activeTool = { person, shift }; renderButtons(); };
    window.changeMonth = function(offset) { currentDate.setMonth(currentDate.getMonth() + offset); renderCalendar(); };
    window.handleDayClick = function(dateStr) {
      if (!activeTool) return;
      if (!schedule[dateStr]) schedule[dateStr] = {};
      if (activeTool.shift === '清除') { delete schedule[dateStr][activeTool.person]; } 
      else { schedule[dateStr][activeTool.person] = activeTool.shift; }
      localStorage.setItem('monthlyScheduleApp', JSON.stringify(schedule));
      renderCalendar();
    };
    window.updateFontSize = function(val) {
        currentFontSize = val;
        document.getElementById('font-size-display').innerText = val + 'px';
        localStorage.setItem('shiftFontSize', val);
        renderCalendar();
    }

    document.getElementById('font-size-slider').value = currentFontSize;
    document.getElementById('font-size-display').innerText = currentFontSize + 'px';
    renderButtons();
    renderCalendar();
  </script>
</body>
</html>
