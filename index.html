<nav class="tabs">
  <button onclick="showPage(1)">清單編輯</button>
  <button onclick="showPage(2)">地圖視圖</button>
  <button onclick="showPage(3)">待辦亮點</button>
</nav>

<div id="page3" class="page" style="display:none;">
  <h2>尚未造訪清單</h2>
  <div id="unvisitedList" class="card-container">
    </div>
</div>

<script>
// 假設資料結構中包含：category (類別), rating (1-5), status (visited: true/false)

// 類別選項定義
const categories = ["美食", "景點", "住宿", "購物"];

// 切換頁面邏輯
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  document.getElementById('page' + pageId).style.display = 'block';
  if(pageId === 3) renderUnvisited();
}

// 渲染未造訪名單
function renderUnvisited() {
  const container = document.getElementById('unvisitedList');
  const unvisitedItems = data.filter(item => !item.visited); // 篩選還沒去的
  
  container.innerHTML = unvisitedItems.map(item => `
    <div class="item-card">
      <div class="card-header">
        <span class="flag-icon">🚩</span>
        <span class="title">${item.name}</span>
      </div>
      
      <div class="card-body">
        <div class="selector-group">
          <label>類別：</label>
          <div class="btn-group">
            ${categories.map(cat => `
              <button class="${item.category === cat ? 'active' : ''}" 
                      onclick="updateCategory('${item.id}', '${cat}')">${cat}</button>
            `).join('')}
          </div>
        </div>

        <div class="selector-group">
          <label>評級：</label>
          <div class="rating-group">
            ${[1,2,3,4,5].map(num => `
              <span class="star ${item.rating >= num ? 'filled' : ''}" 
                    onclick="updateRating('${item.id}', ${num})">★</span>
            `).join('')}
          </div>
        </div>
      </div>
      
      <button class="check-btn" onclick="toggleVisited('${item.id}')">設為已去</button>
    </div>
  `).join('');
}

// 更新評分的邏輯
function updateRating(id, newRating) {
  const target = data.find(i => i.id === id);
  if(target) {
    target.rating = newRating;
    renderUnvisited(); // 即時重新渲染
    saveData(); // 儲存到 LocalStorage
  }
}

// 更新類別的邏輯
function updateCategory(id, newCat) {
  const target = data.find(i => i.id === id);
  if(target) {
    target.category = newCat;
    renderUnvisited();
    saveData();
  }
}
</script>

<style>
/* 樣式優化 */
.item-card {
  background: #fff;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.btn-group button {
  padding: 4px 8px;
  margin-right: 5px;
  border: 1px solid #ddd;
  background: #f9f9f9;
  border-radius: 4px;
}

.btn-group button.active {
  background: #007bff;
  color: white;
  border-color: #0056b1;
}

.rating-group .star {
  font-size: 20px;
  cursor: pointer;
  color: #ccc;
}

.rating-group .star.filled {
  color: #ffc107;
}

.selector-group {
  margin: 10px 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
</style>
